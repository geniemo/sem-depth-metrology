seed: 43
data:
  sim_sem_dir: data/raw/simulation_data/SEM
  sim_depth_dir: data/raw/simulation_data/Depth
  val_fraction: 0.1
model:
  encoder: convnext_small
  pretrained: true
train:
  epochs: 40
  batch_size: 256
  lr: 3.0e-4
  weight_decay: 1.0e-4
  num_workers: 8
  amp: true
  augment: true
  loss: l1l2
  input_mode: itr_mean
out:
  run_name: e12c_cns_l1l2_base
  runs_dir: experiments/runs
  results_csv: experiments/results.csv
