seed: 42
data:
  root: data/raw
  translated_root: data/translated_ep120
  holdout_sites: 60
train:
  encoder: resnet18
  dim: 128
  temperature: 0.1
  max_shift: 2
  batch_size: 256
  lr: 1.0e-4
  weight_decay: 1.0e-4
  num_workers: 8
  epochs: 20
out:
  dir: experiments/runs/embed_v2
  run_name: embed_v2
  results_csv: experiments/results.csv
