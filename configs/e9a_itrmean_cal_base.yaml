seed: 42
data:
  sim_sem_dir: data/raw/simulation_data/SEM
  sim_depth_dir: data/raw/simulation_data/Depth
  val_fraction: 0.1
model:
  encoder: resnet34
  pretrained: true
train:
  epochs: 40
  batch_size: 256
  lr: 3.0e-4
  weight_decay: 1.0e-4
  num_workers: 8
  amp: true
  augment: true
  input_mode: itr_mean
  appearance:
    blur_sigma: [0.5, 0.9]   # spectrum-calibrated: sigma*=0.7
out:
  run_name: e9a_itrmean_cal_base
  runs_dir: experiments/runs
  results_csv: experiments/results.csv
