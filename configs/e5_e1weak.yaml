seed: 42
init_ckpt: experiments/runs/e1_appearance_r34/best.pt
data:
  sim_sem_dir: data/raw/simulation_data/SEM
  sim_depth_dir: data/raw/simulation_data/Depth
  real_sem_root: data/raw/train/SEM
  real_csv: data/raw/train/average_depth.csv
  val_fraction: 0.1
model:
  encoder: resnet34
train:
  epochs: 8
  batch_size: 256
  real_batch: 256
  lr: 1.0e-4
  weight_decay: 1.0e-4
  num_workers: 8
  amp: true
  augment: true
  appearance:
    brightness: [-0.05, 0.22]
    contrast: [0.85, 1.30]
    blur_sigma: [0.0, 1.5]
    noise_std: [0.0, 0.04]
  lambda_real: 1.0
  refit_sample: 8192
out:
  run_name: e5_e1weak_r34
  runs_dir: experiments/runs
  results_csv: experiments/results.csv
